[profile]
id = "merian"
title = "Lepidoptera Merian elements"
description = "Thirty-two ancestral linkage groups reconstructed for Lepidoptera."
paper_doi = "10.1038/s41559-024-02329-4"
busco_dataset = "lepidoptera_odb10"
taxid = 7088
taxonomy_names = ["Lepidoptera"]
auto_priority = 100
auto_default = true
default_palette = "merianbow4"

